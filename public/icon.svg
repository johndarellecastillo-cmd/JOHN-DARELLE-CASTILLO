<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Outer QR Corner Markers -->
  <g fill="url(#emeraldGrad)" filter="url(#glow)">
    <!-- Top-Left Marker -->
    <path d="M104 104 h88 v88 h-88 z m24 24 v40 h40 v-40 z" />
    <rect x="140" y="140" width="16" height="16" rx="4" />

    <!-- Top-Right Marker -->
    <path d="M320 104 h88 v88 h-88 z m24 24 v40 h40 v-40 z" />
    <rect x="356" y="140" width="16" height="16" rx="4" />

    <!-- Bottom-Left Marker -->
    <path d="M104 320 h88 v88 h-88 z m24 24 v40 h40 v-40 z" />
    <rect x="140" y="356" width="16" height="16" rx="4" />
  </g>

  <!-- QR Center Pattern & Check Badge -->
  <g fill="#f4f4f5">
    <rect x="224" y="104" width="24" height="24" rx="6" />
    <rect x="264" y="104" width="24" height="48" rx="6" />
    <rect x="224" y="152" width="24" height="40" rx="6" />
    <rect x="104" y="224" width="40" height="24" rx="6" />
    <rect x="168" y="224" width="24" height="24" rx="6" />
    <rect x="104" y="272" width="24" height="24" rx="6" />
    <rect x="152" y="272" width="40" height="24" rx="6" />
  </g>

  <!-- Central Verification Badge -->
  <g filter="url(#glow)">
    <circle cx="330" cy="330" r="76" fill="#10b981" />
    <circle cx="330" cy="330" r="68" fill="#047857" />
    <!-- Checkmark -->
    <path d="M298 330 l22 22 l42 -44" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
